name: Inspect PaddleOCR.js

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Inspect PaddleOCR.js
        run: |
          cat node_modules/@paddleocr/paddleocr-js/README.md
