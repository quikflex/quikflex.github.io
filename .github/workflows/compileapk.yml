name: Test Bubblewrap Container

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/googlechromelabs/bubblewrap:1.25.0

    steps:
      - name: Inspect container
        run: |
          echo "=== USER ==="
          whoami

          echo "=== BUBBLEWRAP ==="
          which bubblewrap
          type bubblewrap
          npm list -g @bubblewrap/cli || true

          echo "=== JAVA ==="
          which java || true
          java -version || true

          echo "=== CONFIG ==="
          ls -la /root/.bubblewrap || true
          cat /root/.bubblewrap/config.json || true

          echo "=== ENVIRONMENT ==="
          env | grep -E 'JAVA|ANDROID|BUBBLE' || true

      - name: Run Bubblewrap version
        run: |
          bubblewrap --version
