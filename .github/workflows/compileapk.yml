name: Build QuikFlex Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # CREATE TEST KEYSTORE
      # ---------------------------------------------------------
      # This is ONLY for development/testing.
      # Replace it with the real production keystore later.
      # ---------------------------------------------------------
      - name: Create test keystore
        run: |
          keytool \
            -genkeypair \
            -v \
            -keystore android.keystore \
            -alias quikflex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=QuikFlex, OU=Development, O=QuikFlex, L=Port Moresby, ST=National Capital District, C=PG"

          echo "Test keystore created."

      # ---------------------------------------------------------
      # CREATE BUBBLEWRAP MANIFEST
      # ---------------------------------------------------------
      - name: Create Bubblewrap manifest
        run: |
          cat > twa-manifest.json <<'EOF'
          {
            "packageId": "com.quikflex.app",
            "host": "quikflex.github.io",

            "name": "QuikFlex",
            "launcherName": "QuikFlex",

            "display": "standalone",

            "themeColor": "#f9f9f9",
            "themeColorDark": "#000000",

            "navigationColor": "#f9f9f9",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#00000000",

            "backgroundColor": "#1fe009",

            "enableNotifications": true,

            "startUrl": "/app.html",

            "iconUrl": "https://quikflex.github.io/images/web-app-manifest-512x512.png",
            "maskableIconUrl": "https://quikflex.github.io/images/web-app-manifest-512x512.png",

            "splashScreenFadeOutDuration": 300,

            "signingKey": {
              "path": "./android.keystore",
              "alias": "quikflex"
            },

            "appVersionCode": 1,
            "appVersion": "1.0.0",

            "webManifestUrl": "https://quikflex.github.io/images/site.webmanifest",

            "orientation": "default",

            "minSdkVersion": 19,

            "generatorApp": "Bubblewrap",

            "shortcuts": [],
            "features": {},

            "alphaDependencies": {
              "enabled": false
            },

            "isChromeOSOnly": false,
            "isMetaQuest": false,

            "additionalTrustedOrigins": []
          }
          EOF

          echo "Manifest created:"
          cat twa-manifest.json

      # ---------------------------------------------------------
      # BUBBLEWRAP
      # ---------------------------------------------------------
      #
      # IMPORTANT:
      # We deliberately run Bubblewrap INSIDE the official
      # Bubblewrap Docker image, like WASudoku does.
      #
      # This avoids the interactive JDK/Android SDK setup that
      # killed the previous workflow.
      # ---------------------------------------------------------
      - name: Build APK and AAB with Bubblewrap
        run: |
          docker run \
            --rm \
            --entrypoint sh \
            -e "BUBBLEWRAP_KEYSTORE_PASSWORD=android" \
            -e "BUBBLEWRAP_KEY_PASSWORD=android" \
            -v "${PWD}:/app" \
            -w /app \
            ghcr.io/googlechromelabs/bubblewrap:1.25.0 \
            -c '
              bubblewrap update &&
              yes | bubblewrap build
            '

      # ---------------------------------------------------------
      # SHOW OUTPUT
      # ---------------------------------------------------------
      - name: Show generated files
        run: |
          echo "=== BUILD OUTPUT ==="
          ls -lah

          echo
          echo "=== APK FILES ==="
          find . -name "*.apk" -type f -print

          echo
          echo "=== AAB FILES ==="
          find . -name "*.aab" -type f -print

      # ---------------------------------------------------------
      # UPLOAD APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuikFlex-APK
          path: "**/*.apk"
          if-no-files-found: error

      # ---------------------------------------------------------
      # UPLOAD AAB
      # ---------------------------------------------------------
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: QuikFlex-AAB
          path: "**/*.aab"
          if-no-files-found: error
