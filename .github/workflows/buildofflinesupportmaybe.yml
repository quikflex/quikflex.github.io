name: Inspect QuikScan offline WASM

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Inspect ONNX Runtime WASM
        run: |
          echo "=== ONNX Runtime ==="
          npm ls onnxruntime-web || true

          echo ""
          echo "=== WASM FILES ==="

          find node_modules \
            -path "*/onnxruntime-web/dist/*.wasm" \
            -type f \
            -printf '%f\n' \
            | sort

          echo ""
          echo "=== COUNT ==="

          find node_modules \
            -path "*/onnxruntime-web/dist/*.wasm" \
            -type f \
            | wc -l
