name: Build and Deploy QuikScan offline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare ONNX Runtime WASM
        run: |
          echo "Locating ONNX Runtime Web..."

          ORT_PACKAGE=$(find node_modules -path '*/onnxruntime-web/package.json' -print -quit)

          if [ -z "$ORT_PACKAGE" ]; then
            echo "ERROR: onnxruntime-web package not found."
            exit 1
          fi

          ORT_DIR=$(dirname "$ORT_PACKAGE")

          echo "ONNX Runtime found at:"
          echo "$ORT_DIR"

          echo "Available files:"
          ls -lah "$ORT_DIR/dist"

          mkdir -p ocr/wasm

          cp "$ORT_DIR"/dist/*.wasm ocr/wasm/

          echo "Final WASM directory:"
          ls -lah ocr/wasm

          WASM_COUNT=$(find ocr/wasm -name "*.wasm" | wc -l)

          if [ "$WASM_COUNT" -eq 0 ]; then
            echo "ERROR: No WASM files were copied!"
            exit 1
          fi

          echo "Successfully copied $WASM_COUNT WASM files."

      - name: Build QuikScan
        run: |
          npx esbuild script.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --external:fs \
            --external:path \
            --outfile=script.bundle.js

      - name: Verify build
        run: |
          echo "Checking required files..."

          test -f index.html
          test -f script.bundle.js
          test -f style.css
          test -d images
          test -d ocr
          test -d ocr/wasm

          WASM_COUNT=$(find ocr/wasm -name "*.wasm" | wc -l)

          if [ "$WASM_COUNT" -eq 0 ]; then
            echo "ERROR: ocr/wasm contains no WASM files!"
            exit 1
          fi

          echo ""
          echo "Required files found."
          echo ""
          echo "WASM files:"
          find ocr/wasm -maxdepth 1 -type f -printf '%f\n'

          echo ""
          echo "Build successful."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
