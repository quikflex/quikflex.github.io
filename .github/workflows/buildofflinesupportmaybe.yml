name: Inspect QuikScan offline WASM

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Find ONNX Runtime
        run: |
          echo "========================================"
          echo "ONNX Runtime version"
          echo "========================================"

          npm ls onnxruntime-web || true

          echo ""
          echo "========================================"
          echo "WASM files"
          echo "========================================"

          find node_modules \
            -path "*/onnxruntime-web/dist/*.wasm" \
            -type f \
            -printf '%f\n' \
            | sort

          echo ""
          echo "========================================"
          echo "WASM count"
          echo "========================================"

          COUNT=$(find node_modules \
            -path "*/onnxruntime-web/dist/*.wasm" \
            -type f \
            | wc -l)

          echo "$COUNT WASM files found."
