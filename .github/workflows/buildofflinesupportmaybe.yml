name: Build and Deploy QuikScan Offline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare ONNX Runtime WASM
        run: |
          echo "Finding ONNX Runtime Web..."

          ORT_DIR=$(dirname "$(find node_modules -path '*/onnxruntime-web/package.json' -print -quit)")

          if [ -z "$ORT_DIR" ] || [ "$ORT_DIR" = "." ]; then
            echo "ERROR: Could not find onnxruntime-web"
            exit 1
          fi

          echo "Found ONNX Runtime at:"
          echo "$ORT_DIR"

          mkdir -p ocr/wasm

          cp "$ORT_DIR"/dist/*.wasm ocr/wasm/

          echo "Copied WASM files:"
          ls -lh ocr/wasm/

      - name: Build QuikScan
        run: |
          npx esbuild script.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --external:fs \
            --external:path \
            --outfile=script.bundle.js

      - name: Verify build files
        run: |
          echo "Checking required files..."

          test -f index.html
          test -f script.bundle.js
          test -d ocr
          test -d ocr/wasm

          echo "WASM files:"
          ls -lh ocr/wasm/

          echo "Build successful."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
