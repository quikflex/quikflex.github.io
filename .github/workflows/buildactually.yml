name: Build and Deploy QuikScan

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build JavaScript
        run: |
          npx esbuild script.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --external:fs \
            --external:path \
            --outfile=script.bundle.js

      - name: Prepare Pages directory
        run: |
          mkdir -p _site/.well-known

          # Copy the entire website
          cp -r ./* _site/ 2>/dev/null || true

          # Copy hidden files/directories explicitly
          cp -r .well-known/* _site/.well-known/

          echo "=== DEPLOYMENT CONTENTS ==="
          find _site -maxdepth 3 -type f | sort

          echo "=== ASSETLINKS ==="
          cat _site/.well-known/assetlinks.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
