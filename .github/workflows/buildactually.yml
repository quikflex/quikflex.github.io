name: Build and Deploy QuikScan

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build JavaScript
        run: |
          npx esbuild script.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --external:fs \
            --external:path \
            --outfile=script.bundle.js

      - name: Prepare Pages directory
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          echo "=== COPYING WEBSITE ==="

          # Copy normal website files/directories
          find . -maxdepth 1 -mindepth 1 \
            ! -name ".git" \
            ! -name "_site" \
            ! -name ".well-known" \
            -exec cp -r {} _site/ \;

          echo "=== CREATING .well-known ==="

          mkdir -p _site/.well-known

          cp .well-known/assetlinks.json \
             _site/.well-known/assetlinks.json

          echo "=== VERIFYING ASSETLINKS ==="

          test -f "_site/.well-known/assetlinks.json"

          echo "--- file ---"
          ls -la _site/.well-known/

          echo "--- contents ---"
          cat _site/.well-known/assetlinks.json

          echo "=== VERIFYING WEBSITE ==="

          test -f "_site/app.html"

          echo "=== FINAL FILE TREE ==="
          find _site -maxdepth 3 -type f | sort

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
