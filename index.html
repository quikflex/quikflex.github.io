<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <title>QuikScan</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Camera -->
        <section id="cameraView" class="view active">

            <video
                id="camera"
                autoplay
                playsinline
                muted
            ></video>

            <div class="scanner-overlay">

                <div class="scan-frame">
                    <span class="corner top-left"></span>
                    <span class="corner top-right"></span>
                    <span class="corner bottom-left"></span>
                    <span class="corner bottom-right"></span>
                </div>

                <p class="instruction">
                    Putim Flex kod insait long bokis
                </p>

            </div>

            <div class="controls">

                <button id="startButton" class="button primary">
                    📷 Statim Kamera
                </button>

                <button id="captureButton" class="button primary hidden">
                    📸 Kisim Piksa
                </button>

            </div>

        </section>

        <!-- Preview -->
        <section id="previewView" class="view">

            <div class="preview-container">

                <h1>Yu kisim dispela piksa</h1>

                <img
                    id="previewImage"
                    alt="Piksa bilong Flex kad"
                >

                <div class="preview-actions">

                    <button id="retakeButton" class="button secondary">
                        🔄 Kisim Gen
                    </button>

                    <button id="scanButton" class="button primary">
