<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">

    <title>QuikScan</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="scanner">

    <!-- CAMERA -->

    <video id="camera" autoplay playsinline></video>

    <div class="overlay">

        <div class="scan-frame">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
        </div>

        <p class="instruction">
            Putim Flex kod insait long bokis
        </p>

    </div>

    <button id="startCamera">
        Statim Kamera
    </button>

    <button id="captureButton" disabled>
        📷 Skanim
    </button>


    <!-- CAPTURE PREVIEW / CROP -->

    <div id="preview" class="preview">

        <p class="cropInstruction">
            ✂️ Makim code tasol
        </p>

        <div id="cropArea" class="crop-area">

            <img
                id="previewImage"
                alt="Piksa bilong Flex kad"
            >

            <div id="cropSelection" class="crop-selection">
                <div class="crop-handle top-left"></div>
                <div class="crop-handle top-right"></div>
                <div class="crop-handle bottom-left"></div>
                <div class="crop-handle bottom-right"></div>
            </div>

        </div>

        <div class="cropButtons">

            <button id="retakeButton">
                🔄 Kisim Gen
            </button>

            <button id="cropButton">
                ✂️ Cropim Code
            </button>

        </div>

    </div>


    <!-- CROPPED RESULT -->

    <div id="croppedPreview" class="cropped-preview">

        <p>
            Code bilong OCR:
        </p>

        <img
            id="croppedImage"
            alt="Cropped Flex code"
        >

        <button id="backToCropButton">
            🔄 Cropim Gen
        </button>

    </div>


    <canvas id="captureCanvas"></canvas>
    <canvas id="cropCanvas"></canvas>

</main>

<script src="script.js"></script>

</body>
</html>
