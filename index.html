<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>QuikScan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/images/favicon-96x96.png?v=1" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg?v=1" />
    <link rel="shortcut icon" href="/images/favicon.ico?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png?v=1" />
    <meta name="apple-mobile-web-app-title" content="QuikScan" />
    <link rel="manifest" href="/images/site.webmanifest?v=1" />
</head>

<body>

<main class="scanner">

    <video id="camera" autoplay playsinline></video>

    <div class="overlay">

        <div class="scan-frame">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
        </div>

        <p class="instruction">
            Putim Flex kod insait long bokis
        </p>

    </div>

    <button id="startCamera">
        Statim Kamera
    </button>

    <button id="captureButton" disabled style="display: none;">
        📷 Skanim
    </button>

    <div id="preview" class="preview">
        <img id="previewImage" alt="Piksa bilong Flex kad">

        <button id="retakeButton">
            🔄 Kisim Gen
        </button>
    </div>

    <canvas id="captureCanvas"></canvas>

</main>

<script src="script.js"></script>

</body>
</html>
