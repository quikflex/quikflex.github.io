<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">

    <title>QuikScan</title>
<link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
<link rel="shortcut icon" href="/images/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="QuikScan" />
<link rel="manifest" href="/images/site.webmanifest" />
<link rel="stylesheet" href="/style.css" />

</head>

<body>

<main class="scanner">

    <!-- CAMERA -->

    <video id="camera" autoplay playsinline></video>

    <div class="overlay">

        <div class="scan-frame">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
        </div>

        <p class="instruction">
            Putim Flex kod insait long bokis
        </p>

    </div>

    <button id="captureButton" disabled style="display: none;">
    📷 Skanim
</button>


    <!-- CAPTURE PREVIEW / CROP -->

    


    <!-- CROPPED RESULT -->

<div id="croppedPreview" class="cropped-preview">

    <p>
        Code bilong OCR:
    </p>

    <img
        id="croppedImage"
        alt="Cropped Flex code"
    >

    <p id="ocrStatus"></p>

    <input
        id="ocrResult"
        type="tel"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="off"
        placeholder="OCR result bai kam hia"
    >

    <button id="confirmButton">
        ✅ Confirm
    </button>

    <button id="backToCropButton">
        🔄 Kisim Gen
    </button>

</div>


    <canvas id="captureCanvas"></canvas>
    <canvas id="cropCanvas"></canvas>

</main>


<script type="module" src="script.bundle.js"></script>

</body>
</html>
