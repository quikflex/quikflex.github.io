<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">

    <title>QuikScan</title>
<!-- PWA -->
<link rel="manifest" href="/images/site.webmanifest">

<!-- App icons -->
<link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/images/icon-512.png">

<!-- iOS -->
<link rel="apple-touch-icon" sizes="180x180" href="/images/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="QuikScan">

<!-- Theme -->
<meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="scanner">

    <!-- CAMERA -->

    <video id="camera" autoplay playsinline></video>

    <div class="overlay">

        <div class="scan-frame">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
        </div>

        <p class="instruction">
            Putim Flex kod insait long bokis
        </p>

    </div>

    <button id="startCamera">
        Statim Kamera
    </button>

    <button id="captureButton" disabled style="display: none;">
    📷 Skanim
</button>


    <!-- CAPTURE PREVIEW / CROP -->

    <div id="preview" class="preview">

        <p class="cropInstruction">
            ✂️ Makim code tasol
        </p>

        <div id="cropArea" class="crop-area">

            <img
                id="previewImage"
                alt="Piksa bilong Flex kad"
            >

            <div id="cropSelection" class="crop-selection">
                <div class="crop-handle top-left"></div>
                <div class="crop-handle top-right"></div>
                <div class="crop-handle bottom-left"></div>
                <div class="crop-handle bottom-right"></div>
            </div>

        </div>

        <div class="cropButtons">

            <button id="retakeButton">
                🔄 Kisim Gen
            </button>

            <button id="cropButton">
                ✂️ Cropim Code
            </button>

        </div>

    </div>


    <!-- CROPPED RESULT -->

<div id="croppedPreview" class="cropped-preview">

    <p>
        Code bilong OCR:
    </p>

    <img
        id="croppedImage"
        alt="Cropped Flex code"
    >

    <button id="ocrButton">
        🔍 Luksave Code
    </button>

    <p id="ocrStatus"></p>

    <input
        id="ocrResult"
        type="tel"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="off"
        placeholder="OCR result bai kam hia"
    >

    <button id="confirmButton">
        ✅ Confirm
    </button>

    <button id="backToCropButton">
        🔄 Cropim Gen
    </button>

</div>


    <canvas id="captureCanvas"></canvas>
    <canvas id="cropCanvas"></canvas>

</main>
<script type="module">
    import { createRapidOCREngine } from
        "https://unpkg.com/client-side-ocr@2.1.0/dist/index.mjs";

    window.createRapidOCREngine = createRapidOCREngine;
</script>

<script src="script.js"></script>

</body>
</html>
